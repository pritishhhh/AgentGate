name: Verify AgentGate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check src tests examples scripts
      - run: pytest -q
      - run: agentgate benchmark --output artifacts/evaluation.json
      - run: docker build -t agentgate:ci .
      - run: docker run -d --name agentgate-docker-smoke -p 127.0.0.1:8001:8000 agentgate:ci
      - run: python scripts/verify_container.py
      - uses: actions/upload-artifact@v4
        with:
          name: authorization-evaluation
          path: artifacts/evaluation.json

