<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370"><rect width="1100" height="370" rx="16" fill="#101823"/><style>text{font-family:Segoe UI,Arial,sans-serif}.t{fill:#edf3f7;font-size:18px}.s{fill:#95a4b6;font-size:13px}.label{fill:#99f2c9;font-size:12px;letter-spacing:2px}</style><text x="42" y="45" class="label">AGENTGATE / SHARED ENFORCEMENT BOUNDARY</text><rect x="42" y="95" width="220" height="170" rx="12" fill="#192532" stroke="#344354"/><text x="65" y="127" class="t">Live agents</text><text x="65" y="161" class="s">Ollama tool-calling agent</text><text x="65" y="188" class="s">REST client / any framework</text><text x="65" y="215" class="s">MCP Streamable HTTP client</text><path d="M262 179H330" stroke="#99f2c9" stroke-width="2"/><path d="m323 173 8 6-8 6" fill="none" stroke="#99f2c9" stroke-width="2"/><rect x="335" y="80" width="400" height="200" rx="12" fill="#1b332b" stroke="#689980"/><text x="360" y="115" class="t">Security gateway</text><text x="360" y="150" class="s">Verified identity + trusted resource labels</text><text x="360" y="180" class="s">Per-action authorization + exact-request approval</text><text x="360" y="210" class="s">Strict schemas + timeouts + sensitive-data controls</text><text x="360" y="240" class="s">Argument hashes + HMAC-linked audit evidence</text><path d="M735 179H805" stroke="#99f2c9" stroke-width="2"/><path d="m798 173 8 6-8 6" fill="none" stroke="#99f2c9" stroke-width="2"/><rect x="810" y="95" width="248" height="170" rx="12" fill="#192532" stroke="#344354"/><text x="832" y="127" class="t">Actual tool execution</text><text x="832" y="161" class="s">Document store + database</text><text x="832" y="188" class="s">Approved CSV artifacts</text><text x="832" y="215" class="s">Configured HTTP integrations</text><text x="42" y="330" class="s">Credentials stay outside the model. Every tool call follows the same policy path.</text></svg>

