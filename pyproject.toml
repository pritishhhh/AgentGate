[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "1.0.0"
description = "Policy-enforced tool execution for live AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.0", "uvicorn==0.50.0", "httpx==0.28.1",
  "PyYAML==6.0.3", "jsonschema==4.23.0", "mcp==1.30.0", "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio>=1.0,<2", "ruff>=0.14,<1"]

[project.scripts]
agentgate = "agentgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentgate = ["static/*", "defaults/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

